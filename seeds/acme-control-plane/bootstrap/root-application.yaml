apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-acme-apps
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # Internal cluster DNS targeting the acme organization repo
    repoURL: 'http://gitea.git-server.svc.cluster.local:3000/acme/acme-control-plane.git'
    targetRevision: main
    path: domains
    directory:
      recurse: true
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: openshift-gitops
  syncPolicy:
    automated: 
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false