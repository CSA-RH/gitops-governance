apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: service
          image: openshift/hello-openshift
          ports:
            - containerPort: 8080
          env:
            - name: RESPONSE
              value: "Inventory Service - Default"