apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: appset-core-services
  namespace: openshift-gitops
spec:
  generators:
    - matrix:
        generators:
          - git:
              # Internal cluster DNS targeting the acme organization repo
              repoURL: 'http://gitea.git-server.svc.cluster.local:3000/acme/acme-workloads.git'
              revision: main
              directories:
                - path: workloads/*
          - list:
              elements:
                - env: dev
                - env: test
                - env: prod
  template:
    metadata:
      name: '{{path.basename}}-{{env}}'
      labels:
        environment: '{{env}}'
    spec:
      project: default
      source:
        repoURL: 'http://gitea.git-server.svc.cluster.local:3000/acme/acme-workloads.git'
        targetRevision: main
        path: '{{path}}/overlays/{{env}}'
      destination:
        server: 'https://kubernetes.default.svc'
        namespace: 'acme-{{env}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        managedNamespaceMetadata:
          labels:
            argocd.argoproj.io/managed-by: openshift-gitops